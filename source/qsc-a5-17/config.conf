# Changes reload without reboot. Check log.log when a threshold is reached. Continued charging usually indicates an unsupported control. A steady battery level after cutoff is expected.

#------------------------------

# Cutoff percentage. It must exceed the resume threshold. Set 110 to disable cutoff.
power_stop=100

# Resume when battery capacity is at or below this value. Use a gap of about 5–10 percentage points.
# Some devices stay awake after cutoff while plugged in. Keeping the thresholds close limits this behavior. Unplugging ends it.
# QSC resumes charging only after a cutoff it initiated.
power_start=95

# Seconds to keep charging before cutoff. Enter a positive integer. An active countdown cannot be canceled.
# The delay runs once per stop-and-resume cycle.
# Device sleep can extend the delay. Keep it short.
power_stop_time=3

# Set 1 to wait for full charge, or 0 to disable. At a 100% cutoff it waits for current below 100 mA and bypasses the normal delay.
charge_full=0

# Set 1 to simulate one reconnect per charge session for devices that need this to enter fast charging.
power_reset=0

# Set 1 to log or 0 to stop appending. Existing log.log entries are preserved.
log_enabled=1

# When log.log exceeds this line count, trim the oldest entries and keep roughly two-thirds. Minimum: 100.
log_max_lines=300


#------------------------------

# Toggle with the root manager action or create and remove off_qsc.
# The daemon rescans charging controls about every 60 seconds. Run probe.sh if charging continues after cutoff and attach probe.log to a report.

#------------------------------

# Hide the charging icon. Enabled automatically on supported Unisoc stop_charge devices.
# Uncomment to force the setting. 1 enables it and 0 disables it.
# At cutoff, simulate unplugging to hide the icon and use actual sysfs capacity.
# Update the Android display from sysfs so frozen readings do not block resume.
#hide_charging_icon=1
